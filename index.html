<!doctype html>
<html lang="en-MU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--@head-->
  <link rel="preload" href="/src/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/src/fonts/bodoni-moda-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // The intro plays on every fresh load and every refresh, wherever it happened, but not when you arrive from
    // another page on the site (the page transition covers that) or come back with the back button.
    try {
      // where the 3D car will run, the page keeps its stage dark until the car is ready. The still is framed differently,
      // so showing it first would look like the car jumping when the live one takes over
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !(navigator.connection && navigator.connection.saveData)) document.documentElement.classList.add('has-3d');
      var nav = performance.getEntriesByType('navigation')[0], type = nav ? nav.type : 'navigate';
      var fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
      var sent = sessionStorage.getItem('v8:restart'); // refreshed on another page, and sent here
      sessionStorage.removeItem('v8:restart');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && (sent || type === 'reload' || (type === 'navigate' && !fromSite))) {
        document.documentElement.classList.add('play-intro');
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        scrollTo(0, 0);
      }
      // back from another page: to the place you left, not the top of the page
      if (type === 'back_forward' && sessionStorage.getItem('v8:home-at')) document.documentElement.classList.add('returning');
    } catch (e) {}
  </script>
  <link rel="preload" as="image" href="gate/ignite-off.webp" fetchpriority="high" />
  <link rel="preload" as="fetch" href="model/range-rover.glb" crossorigin="anonymous" media="(min-width: 700px)" />
  <script type="module" src="/src/pages/home.js" blocking="render"></script>
</head>
<body class="page-home">
  <a href="#main" class="skip-link">Skip to content</a>

  <!--@nav:home-->

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <!-- Intro: one continuous shot, drawn live in 3D (src/lib/rover3d.js). The still is the same car, for reduced motion,
           data saver, no WebGL, or while the model loads. -->
      <div class="hero-media" data-hero-media>
        <img class="hero-img" data-hero-img src="hero/range-rover.webp" width="1600" height="1280" fetchpriority="high" decoding="async" draggable="false"
          alt="A white Range Rover with a red bow on its bonnet and its headlights on, at night" />
        <canvas class="hero-canvas" data-hero-canvas aria-hidden="true"></canvas>
        <div class="hero-dark" data-hero-dark aria-hidden="true"></div>
        <span class="hero-flash" aria-hidden="true"></span>
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <h1 class="sr-only" id="hero-title">V8 Motors: used cars in Coromandel, Mauritius</h1>
      <div class="hero-moves" data-hero-moves role="group" aria-label="Make the car move" hidden>
        <button type="button" data-move="spin">Spin it</button>
        <button type="button" data-move="dance">Make it dance</button>
        <button type="button" data-move="lights">Light show</button>
      </div>
      <!-- intro only: letterbox, the V8 badge that flies into the menu bar, and controls while it plays -->
      <div class="bars" data-bars aria-hidden="true"><span></span><span></span></div>
      <div class="intro-badge" data-badge aria-hidden="true"><img src="brand/v8-mark.png" width="364" height="343" alt="" /></div>
      <div class="intro-controls" data-intro-controls hidden><button type="button" data-mute aria-pressed="false">Sound off</button><button type="button" data-intro-skip>Skip</button></div>

      <!-- Intro gate: browsers only allow sound after a tap, so the intro starts with the car's start button -->
      <div class="gate" data-gate>
        <div class="ig-stage">
          <span class="ig-halo" aria-hidden="true"></span>
          <span class="ig-ripple" aria-hidden="true"></span><span class="ig-ripple" aria-hidden="true"></span><span class="ig-ripple" aria-hidden="true"></span>
          <button type="button" class="ignition" data-ignite aria-label="Start the engine and enter the site">
            <img class="ig-layer" src="gate/ignite-off.webp" width="1000" height="1000" alt="" draggable="false">
            <img class="ig-layer ig-ring" src="gate/ignite-ring.webp" width="1000" height="1000" alt="" draggable="false">
            <img class="ig-layer ig-text" src="gate/ignite-text.webp" width="1000" height="1000" alt="" draggable="false">
          </button>
        </div>
      </div>
    </section>

    <!-- the first thing under the car: find one, and what you get with it -->
    <section class="start" aria-label="Find your car">
      <div class="wrap start-wrap">
        <div class="finder" role="search" aria-label="Search cars" data-finder>
          <div class="finder-head">
            <p class="finder-title"><svg viewBox="0 0 28 24" aria-hidden="true"><path d="M3 15v-3l2.4-5.2A2 2 0 0 1 7.2 5.6h7.5M3 15h9m-6 0v2.4M1 11h2M20.500 15a5.500 5.500 0 1 0-4-1.700"/><circle cx="19" cy="9" r="5"/><path d="m23 13 4 4"/></svg>Search cars</p>
            <p class="finder-note"><a class="hero-all" href="inventory.html">See all <!--@total--> cars</a><span class="hero-from">Prices from <strong class="tabular-nums">Rs <!--@from--></strong></span></p>
          </div>
          <div class="finder-row">
            <label class="finder-field"><span class="sr-only">Make</span><select name="make"><option value="">Choose make</option></select></label>
            <label class="finder-field"><span class="sr-only">Model</span><select name="model"><option value="">Choose model</option></select></label>
            <label class="finder-field"><span class="sr-only">Year</span><select name="year"><option value="">Choose year</option></select></label>
            <a class="btn btn-primary finder-go" href="inventory.html" data-finder-go><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-finder-label>Search <!--@total--> cars</span></a>
            <button type="button" class="finder-reset" data-finder-reset aria-label="Reset the search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.600-5.900L4 8.500M4 4v4.500h4.500"/></svg></button>
          </div>
          <script type="application/json" data-finder-data><!--@finder--></script>
        </div>
        <div class="acc" data-acc><!--@promises--></div>
      </div>
    </section>

    <!-- Just in: the four newest cars. To take it out: this block, justInHTML in templates.js, its line in vite.config.js, and its
         part of src/glass.css. The mouse lock in src/pages/home.js finds the screens by itself -->
    <section class="justin" aria-labelledby="justin-title">
      <div class="wrap justin-wrap">
        <div class="justin-head">
          <h2 class="section-title" id="justin-title">Just <em>in</em></h2>
          <a class="hero-all" href="inventory.html">See all <!--@total--> cars</a>
        </div>
        <ul class="grid-cars justin-grid"><!--@justin--></ul>
      </div>
    </section>
  </main>

  <!-- Saturday and the footer share one screen -->
  <div class="finale">
    <section class="sellband" aria-labelledby="sell-title">
      <div class="wrap sellband-inner">
        <div class="sellband-copy">
          <p class="eyebrow">Saturday deals</p>
          <h2 class="section-title" id="sell-title">Best deals every <em>Saturday.</em></h2>
        </div>
        <!-- live: counts down to the next Saturday opening, or to closing while it's on -->
        <div class="countdown" data-countdown>
          <p class="countdown-label" data-cd-label>Next Saturday deals in</p>
          <div class="countdown-units">
            <span><b class="tabular-nums" data-cd="d">0</b><small data-cd-word="d">days</small></span>
            <span><b class="tabular-nums" data-cd="h">00</b><small data-cd-word="h">hours</small></span>
            <span><b class="tabular-nums" data-cd="m">00</b><small>min</small></span>
            <span><b class="tabular-nums" data-cd="s">00</b><small>sec</small></span>
          </div>
        </div>
      </div>
    </section>
    <!--@footer-->
  </div>
  <!--@tabbar:home-->
</body>
</html>
