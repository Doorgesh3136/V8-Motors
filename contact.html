<!doctype html>
<html lang="en-MU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--@head-->
  <link rel="preload" href="/src/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script type="module" src="/src/pages/contact.js" blocking="render"></script>
</head>
<body class="page-contact">
  <a href="#main" class="skip-link">Skip to content</a>
  <!--@nav:contact-->
  <main id="main">
    <section class="page-head wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span aria-hidden="true">/</span><span aria-current="page">Visit us</span></nav>
      <h1 class="page-title" data-title>Visit us in Coromandel</h1>
      <p class="open-status open-status--lg" data-open-status>Open Monday to Saturday</p>
    </section>

    <section class="wrap contact-grid">
      <div class="map-card">
        <iframe title="Map showing V8 Motors at 59B Royal Road, Coromandel" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://maps.google.com/maps?q=V8%20Motors%2059B%20Royal%20Road%20Coromandel%20Mauritius&z=15&output=embed"></iframe>
        <div class="map-overlay">
          <address>59B Royal Road, Coromandel, Mauritius</address>
          <a class="btn btn-primary btn-sm" href="https://www.google.com/maps/dir/?api=1&destination=V8%20Motors%2059B%20Royal%20Road%20Coromandel%20Mauritius" rel="noopener">Get directions</a>
        </div>
      </div>
      <div class="contact-side">
        <table class="hours" aria-label="Opening hours"><tbody data-hours></tbody></table>
        <div class="contact-ways" data-ways></div>
      </div>
    </section>

    <section class="section wrap contact-form-wrap" aria-labelledby="msg-title">
      <div>
        <h2 class="section-title" id="msg-title">Send us a message</h2>
        <p class="section-sub">Write it here and send it to us on WhatsApp, or by email if you prefer. For anything urgent, just call.</p>
      </div>
      <form class="panel contact-form" data-contact-form novalidate>
        <fieldset class="pill-row">
          <legend class="sr-only">What is it about?</legend>
          <label class="pill"><input type="radio" name="topic" value="Buying a car" checked /><span>Buying a car</span></label>
          <label class="pill"><input type="radio" name="topic" value="Selling or exchanging my car" /><span>Selling or exchanging</span></label>
          <label class="pill"><input type="radio" name="topic" value="Leasing" /><span>Leasing</span></label>
          <label class="pill"><input type="radio" name="topic" value="Something else" /><span>Something else</span></label>
        </fieldset>
        <div class="form-row form-row--2">
          <label class="input"><span>Your name</span><input name="name" required autocomplete="name" enterkeyhint="next" /></label>
          <label class="input"><span>Mobile number or email</span><input name="reach" required autocomplete="tel" enterkeyhint="next" /></label>
        </div>
        <label class="input"><span>Message</span><textarea name="msg" rows="5" required maxlength="600"></textarea><span class="char tabular-nums" data-char>0 / 600</span></label>
        <div class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
        <p class="form-error" data-error role="alert" hidden></p>
        <div class="form-send"><button class="btn btn-primary" type="submit" name="via" value="wa">Send on WhatsApp</button><button class="btn btn-line" type="submit" name="via" value="email">Send by email</button></div>
      </form>
    </section>
  </main>
  <!--@footer-->
  <!--@tabbar:contact-->
</body>
</html>
