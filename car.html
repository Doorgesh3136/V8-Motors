<!doctype html>
<html lang="en-MU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--@head-->
  <meta name="robots" content="noindex" />
  <script>
    // Old links used car.html?id=...; every car now has its own page.
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      location.replace(id && /^[a-z0-9-]+$/.test(id) ? 'cars/' + id + '.html' : 'inventory.html');
    })();
  </script>
</head>
<body style="background:#0c1722;color:#ece6dc;font-family:system-ui,sans-serif;padding:2rem">
  <p>Opening the car. If nothing happens, <a href="inventory.html" style="color:#f0a030">browse the inventory</a>.</p>
</body>
</html>
