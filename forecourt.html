<!doctype html>
<html lang="en-MU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--@head-->
  <link rel="preload" href="/src/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/src/fonts/bodoni-moda-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://v8.farhaan.info" />
  <script type="module" src="/src/pages/forecourt.js" blocking="render"></script>
</head>
<body class="page-forecourt">
  <!--@nav:forecourt-->
  <main id="main" class="fc" data-fc data-lenis-prevent tabindex="-1">
    <h1 class="sr-only">The forecourt: every car at V8 Motors</h1>
    <noscript><p class="fc-noscript">The forecourt needs JavaScript. <a class="link" href="inventory.html">See all the cars here instead.</a></p></noscript>
  </main>
  <div class="fc-top">
    <a class="fc-close" href="./" data-fc-close aria-label="Leave the forecourt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <p class="fc-pos tabular-nums" aria-live="polite"><span data-fc-pos>1</span> of <span data-fc-total>0</span></p>
    <a class="fc-garage" href="inventory.html?saved=1" data-saved-link aria-label="My garage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1Z"/></svg><span class="tabular-nums" data-saved-count>0</span></a>
  </div>
  <div class="fc-nav"><button type="button" data-fc-go="-1" aria-label="Previous car"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button><button type="button" data-fc-go="1" aria-label="Next car"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button></div>
  <p class="fc-hint" data-fc-hint aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg><span data-fc-hint-text>Swipe up for the next car</span></p>
  <!--@tabbar:forecourt-->
</body>
</html>
